services:
  bot:
    build: .
    env_file: .env
    command: python -m botsuite.adapters.discord_adapter.bot
    volumes:
      - botdata:/app/data
    environment:
      STORAGE_URL: sqlite:///data/botsuite.sqlite3
    restart: unless-stopped

  # Démo sans jeton Discord : `docker compose run --rm sim`
  sim:
    build: .
    command: python -m botsuite.sim all
    profiles: ["demo"]

volumes:
  botdata:
